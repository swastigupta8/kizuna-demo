version: "3.9"
services:
  booking-api:
    image: kizuna-demo/booking-api
    depends_on:
      - payment-service
      - inventory-service
      - notification-service
    deploy:
      replicas: 3
    labels:
      - "kizuna.critical=true"
      - "kizuna.circuit_breaker=true"
      - "kizuna.timeout_ms=3000"

  payment-service:
    image: kizuna-demo/payment-service
    depends_on:
      - inventory-db
    deploy:
      replicas: 3
    labels:
      - "kizuna.critical=true"
      - "kizuna.circuit_breaker=true"
      - "kizuna.timeout_ms=2000"

  inventory-service:
    image: kizuna-demo/inventory-service
    depends_on:
      - inventory-db
    deploy:
      replicas: 3
    labels:
      - "kizuna.critical=true"
      - "kizuna.circuit_breaker=true"
      - "kizuna.timeout_ms=1500"

  notification-service:
    image: kizuna-demo/notification-service
    depends_on:
      - inventory-db
    deploy:
      replicas: 2
    labels:
      - "kizuna.circuit_breaker=true"
      - "kizuna.timeout_ms=1500"

  inventory-db:
    image: postgres:16
    deploy:
      replicas: 2
    labels:
      - "kizuna.critical=true"
